name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      # brew pr-pull wants a bottle from every leg, so one leg's failure must not
      # cancel the others: they are killed mid-build and upload a half-made
      # bottle that looks like the real thing.
      fail-fast: false
      matrix:
        # No macos-15-intel: Homebrew dropped Intel macOS in September 2026, so
        # openssl@3 and mpdecimal have no bottles there, python@3.13 cannot be
        # installed from one, and the bottle build fails before it starts. The
        # leg can never pass again, and an Intel Mac builds from source whether
        # it runs or not.
        os: [ macos-15, macos-26 ]
        include:
          - os: ubuntu-latest
            container: ghcr.io/homebrew/brew:main
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v5
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      # Linting the tap is one question with one answer, so it is asked once.
      # Asked on every leg it also has to *install* shellcheck there, and a leg
      # that cannot (the Intel runners reach no gmplib.org, so `gmp` builds from
      # source and times out) fails before `--only-formulae` and skips its
      # bottle — losing a platform's bottle to a lint that had already passed
      # three times elsewhere.
      - run: brew test-bot --only-tap-syntax
        if: matrix.os == 'ubuntu-latest'
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
